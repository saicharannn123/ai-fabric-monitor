groups:
  - name: fabric-alerts
    rules:
      - alert: FabricDeviceUnreachable
        expr: fabric_device_up == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} cannot be polled"
          description: "Exporter failed to collect from {{ $labels.device }} for 30s. Check the container / BMC / mgmt path."

      - alert: BGPSessionDown
        expr: fabric_bgp_peer_up == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "BGP down: {{ $labels.device }} -> {{ $labels.remote_device }} ({{ $labels.peer }})"
          description: "Session on {{ $labels.device }} {{ $labels.peer }} is not Established. Check link, optics and BFD."

      - alert: BGPSessionFlapping
        expr: changes(fabric_bgp_peer_up[10m]) > 4
        labels: {severity: warning}
        annotations:
          summary: "BGP flapping on {{ $labels.device }} {{ $labels.peer }}"
          description: "{{ $value }} state changes in 10m - suspect a marginal cable or optic."

      - alert: FabricLinkDown
        expr: fabric_interface_oper_up{interface=~"eth1|eth2"} == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "Fabric link down: {{ $labels.device }} {{ $labels.interface }}"
          description: "Leaf-spine link is operationally down. Fabric capacity reduced."

      - alert: ECMPDegraded
        expr: fabric_route_ecmp_paths{role="leaf", prefix=~"10\\.1\\..*"} < 2
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "ECMP degraded on {{ $labels.device }} to {{ $labels.prefix }}"
          description: "Only {{ $value }} active path(s) to GPU subnet {{ $labels.prefix }} (expected 2). All-reduce bandwidth halved."

      - alert: InterfaceErrors
        expr: fabric:interface_errors:rate1m > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Errors on {{ $labels.device }} {{ $labels.interface }}"
          description: "{{ $value | humanize }} errors/s. Typical causes: dirty fiber, bad DAC/AOC, failing transceiver."

      - alert: LinkUtilizationHigh
        expr: fabric:interface_tx_utilization:ratio > 0.8
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.device }} {{ $labels.interface }} above 80%"
          description: "TX utilisation {{ $value | humanizePercentage }}. Risk of congestion / PFC pauses on a GPU fabric."

      - alert: ECMPLoadImbalance
        expr: fabric:leaf_uplink_imbalance:ratio > 0.3 and on () fabric:gpu_traffic_bps > 1e8
        for: 5m
        labels: {severity: info}
        annotations:
          summary: "Uplink load imbalance on {{ $labels.device }}"
          description: "Uplinks differ by {{ $value | humanizePercentage }} of total - check hashing / flow entropy."
