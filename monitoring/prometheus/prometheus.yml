global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    fabric: ai-fabric-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fabric
    static_configs:
      - targets: ["fabric-exporter:9342"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
