# Monitoring stack for the AI fabric lab.
#   Demo (no lab needed):   docker compose up -d
#   Real containerlab lab:  EXPORTER_MODE=docker docker compose up -d
name: ai-fabric-monitor

services:
  fabric-exporter:
    build: ../exporter
    environment:
      EXPORTER_MODE: ${EXPORTER_MODE:-mock}
      CLAB_LAB_NAME: ai-fabric
      FABRIC_DEVICES: spine1,spine2,leaf1,leaf2
      LINK_SPEED_BPS: "10e9"
      MOCK_STATE_FILE: /state/mock.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # used only in docker mode
      - ./state:/state:ro                                 # failure injection for mock mode
    ports: ["9342:9342"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-fabric.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
