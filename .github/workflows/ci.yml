name: ci
on: [push, pull_request]

jobs:
  exporter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: exporter}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool / amtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar xz
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz | tar xz
          echo "$PWD/prometheus-2.55.1.linux-amd64" >> $GITHUB_PATH
          echo "$PWD/alertmanager-0.27.0.linux-amd64" >> $GITHUB_PATH
      - run: promtool check rules monitoring/prometheus/rules/*.yml
      - run: cd monitoring/prometheus/tests && promtool test rules alerts_test.yml
      - run: amtool check-config monitoring/alertmanager/alertmanager.yml
      - name: Validate dashboard + topology files
        run: |
          pip install pyyaml
          python3 -c "import json; d=json.load(open('monitoring/grafana/dashboards/ai-fabric.json')); print(d['title'], len(d['panels']), 'panels')"
          python3 -c "import yaml; t=yaml.safe_load(open('topology/fabric.clab.yml')); print(len(t['topology']['nodes']), 'nodes', len(t['topology']['links']), 'links')"
