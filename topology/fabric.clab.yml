# AI Fabric Monitor - 2-spine / 2-leaf Clos fabric
# Routing: eBGP unnumbered (RFC 5549) between every leaf and spine, ECMP everywhere.
# Deploy:  sudo containerlab deploy -t topology/fabric.clab.yml
name: ai-fabric

mgmt:
  network: clab-ai-fabric-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
  kinds:
    linux:
      image: quay.io/frrouting/frr:9.1.0
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.forwarding: 1
        # hash on L4 ports so parallel GPU flows between the same two hosts spread across spines
        net.ipv4.fib_multipath_hash_policy: 1

  nodes:
    spine1:
      mgmt-ipv4: 172.20.20.11
      binds:
        - configs/spine1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    spine2:
      mgmt-ipv4: 172.20.20.12
      binds:
        - configs/spine2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf1:
      mgmt-ipv4: 172.20.20.21
      binds:
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    leaf2:
      mgmt-ipv4: 172.20.20.22
      binds:
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons

    # "GPU servers" - lightweight hosts used to push traffic across the fabric
    gpu-host1:
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.20.31
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.1.1.1
    gpu-host2:
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.20.32
      exec:
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.1.2.1

  links:
    # leaf uplinks: eth1 -> spine1, eth2 -> spine2
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    # server downlinks
    - endpoints: ["leaf1:eth3", "gpu-host1:eth1"]
    - endpoints: ["leaf2:eth3", "gpu-host2:eth1"]
