<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#ffffff"/>

  <!-- fabric box -->
  <rect x="20" y="20" width="470" height="430" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="46" font-size="15" font-weight="600" fill="#0f172a">containerlab: ai-fabric (FRR 9.1)</text>
  <text x="40" y="64" fill="#475569">eBGP unnumbered · BFD · ECMP (L4 hash) · jumbo MTU 9500</text>

  <!-- links leaf-spine -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="140" y1="132" x2="140" y2="262"/>
    <line x1="140" y1="132" x2="370" y2="262"/>
    <line x1="370" y1="132" x2="140" y2="262"/>
    <line x1="370" y1="132" x2="370" y2="262"/>
    <line x1="140" y1="302" x2="140" y2="372"/>
    <line x1="370" y1="302" x2="370" y2="372"/>
  </g>
  <!-- spines -->
  <g>
    <rect x="80" y="96" width="120" height="40" rx="8" fill="#1e3a8a"/>
    <text x="140" y="115" text-anchor="middle" fill="#fff" font-weight="600">spine1</text>
    <text x="140" y="130" text-anchor="middle" fill="#bfdbfe" font-size="11">AS 65000 · 10.0.0.1</text>
    <rect x="310" y="96" width="120" height="40" rx="8" fill="#1e3a8a"/>
    <text x="370" y="115" text-anchor="middle" fill="#fff" font-weight="600">spine2</text>
    <text x="370" y="130" text-anchor="middle" fill="#bfdbfe" font-size="11">AS 65000 · 10.0.0.2</text>
  </g>
  <!-- leaves -->
  <g>
    <rect x="80" y="262" width="120" height="40" rx="8" fill="#0369a1"/>
    <text x="140" y="281" text-anchor="middle" fill="#fff" font-weight="600">leaf1</text>
    <text x="140" y="296" text-anchor="middle" fill="#e0f2fe" font-size="11">AS 65101 · 10.0.0.11</text>
    <rect x="310" y="262" width="120" height="40" rx="8" fill="#0369a1"/>
    <text x="370" y="281" text-anchor="middle" fill="#fff" font-weight="600">leaf2</text>
    <text x="370" y="296" text-anchor="middle" fill="#e0f2fe" font-size="11">AS 65102 · 10.0.0.12</text>
  </g>
  <!-- hosts -->
  <g>
    <rect x="80" y="372" width="120" height="44" rx="8" fill="#15803d"/>
    <text x="140" y="391" text-anchor="middle" fill="#fff" font-weight="600">gpu-host1</text>
    <text x="140" y="407" text-anchor="middle" fill="#dcfce7" font-size="11">10.1.1.10/24</text>
    <rect x="310" y="372" width="120" height="44" rx="8" fill="#15803d"/>
    <text x="370" y="391" text-anchor="middle" fill="#fff" font-weight="600">gpu-host2</text>
    <text x="370" y="407" text-anchor="middle" fill="#dcfce7" font-size="11">10.1.2.10/24</text>
  </g>
  <rect x="205" y="236" width="100" height="18" rx="4" fill="#f1f5f9"/><text x="255" y="249" text-anchor="middle" fill="#334155" font-size="11">eth1 / eth2 uplinks</text>
  <text x="255" y="436" text-anchor="middle" fill="#334155" font-size="11">iperf3 · 8 parallel flows</text>

  <!-- exporter -->
  <rect x="540" y="60" width="190" height="96" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="635" y="85" text-anchor="middle" font-weight="600" fill="#9a3412">fabric-exporter (Python)</text>
  <text x="635" y="104" text-anchor="middle" fill="#7c2d12" font-size="11">docker exec → vtysh JSON, sysfs</text>
  <text x="635" y="120" text-anchor="middle" fill="#7c2d12" font-size="11">BGP · interfaces · ECMP width</text>
  <text x="635" y="136" text-anchor="middle" fill="#7c2d12" font-size="11">mock mode = simulated fabric</text>
  <line x1="490" y1="108" x2="536" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- prometheus -->
  <rect x="540" y="200" width="190" height="80" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="635" y="226" text-anchor="middle" font-weight="600" fill="#991b1b">Prometheus</text>
  <text x="635" y="245" text-anchor="middle" fill="#7f1d1d" font-size="11">5 s scrape · recording rules</text>
  <text x="635" y="261" text-anchor="middle" fill="#7f1d1d" font-size="11">8 alert rules (unit-tested)</text>
  <line x1="635" y1="156" x2="635" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="645" y="181" fill="#475569" font-size="11">/metrics :9342</text>

  <!-- grafana -->
  <rect x="770" y="160" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="855" y="188" text-anchor="middle" font-weight="600" fill="#92400e">Grafana</text>
  <text x="855" y="207" text-anchor="middle" fill="#78350f" font-size="11">Leaf/Spine health dashboard</text>
  <line x1="730" y1="230" x2="766" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- alertmanager -->
  <rect x="770" y="260" width="170" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="855" y="288" text-anchor="middle" font-weight="600" fill="#5b21b6">Alertmanager</text>
  <text x="855" y="307" text-anchor="middle" fill="#4c1d95" font-size="11">inhibition · Slack-ready</text>
  <line x1="730" y1="252" x2="766" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- chaos -->
  <rect x="540" y="350" width="400" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="560" y="376" font-weight="600" fill="#0f172a">scripts/chaos.sh</text>
  <text x="560" y="396" fill="#334155" font-size="12">link-down · flap · errors · clear</text>
  <text x="560" y="414" fill="#334155" font-size="12">Break the fabric on purpose → watch failover and alerts</text>
  <line x1="540" y1="390" x2="494" y2="330" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
